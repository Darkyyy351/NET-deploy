name: Deploy CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: deploy-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate Bash syntax
        run: |
          bash -n update.sh
          bash -n install-host-control.sh

      - name: Test host control
        run: python3 host-control/test_host_control.py

      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install --yes shellcheck

      - name: Lint updater
        run: shellcheck update.sh install-host-control.sh
